<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mes courses EPS</title><style>*{box-sizing:border-box}body{margin:0;background:#121813;color:#f5eee2;font:15px/1.5 Arial}header,main{max-width:1120px;margin:auto;padding:22px}header{border-bottom:1px solid #7e6944}h1,h2{font-family:Georgia,serif;font-weight:400;color:#e7c58a}.panel{background:#202820;border:1px solid #776340;border-radius:12px;padding:20px;margin:18px 0}button{background:#e2bf7c;color:#171a14;padding:11px 17px;border:0;border-radius:7px;cursor:pointer;margin:5px}button:disabled{opacity:.45}input,select{padding:11px;background:#101810;color:white;border:1px solid #97805a;border-radius:7px;margin:5px;max-width:100%}a{color:#e6c48a}.hidden{display:none}.error{color:#ffb5a5}.item{padding:15px 0;border-bottom:1px solid #5a614f}.muted{color:#c5c3b7}.scroll{overflow-x:auto}</style><style id="eps-mobile-density-v2">

</style></head><body><header><a href="../">← Espace chauffeur</a> · <a href="../documents/">Mes documents</a></header><main><h1>Mes courses EPS</h1><p class="muted">Vous voyez uniquement les courses proposées à votre catégorie et votre rémunération. Les comptes non validés ou avec des documents expirés n’ont pas accès aux offres.</p><section id="login" class="panel"><h2>Connexion chauffeur</h2><form id="loginform"><input id="email" type="email" placeholder="Email" autocomplete="email" required><input id="password" type="password" placeholder="Mot de passe" autocomplete="current-password" required><button>Se connecter</button></form><p id="loginmsg"></p></section><section id="app" class="hidden"><button id="refresh">Actualiser les courses</button><button id="logout">Déconnexion</button><p id="msg" role="status"></p><section class="panel"><h2>Courses disponibles</h2><div id="available"></div></section><section class="panel"><h2>Mes courses acceptées</h2><div id="accepted"></div></section></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const db=createClient('https://lrtuztxjngdvrnjuwxfr.supabase.co','sb_publishable_GeaRT-N3IE03M19HCB4MVg_RQwbSnYu');const $=id=>document.getElementById(id);const el=(t,v)=>{const x=document.createElement(t);x.textContent=v;return x};function msg(v,error=false){$('msg').textContent=v;$('msg').classList.toggle('error',error)}async function guard(){const{data:{user}}=await db.auth.getUser();$('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);if(user)load()}async function load(){msg('Actualisation…');$('available').replaceChildren();$('accepted').replaceChildren();const r=await db.rpc('eps_driver_dispatch_board');if(r.error){msg(r.error.message,true);return}for(const ride of r.data){const row=el('div','');row.className='item';row.append(el('h3',ride.departure+' → '+ride.destination),el('p',ride.ride_date+' '+ride.ride_time+' · '+ride.vehicle+' · '+(ride.passengers||'')+' passagers'),el('p','Votre rémunération : '+(ride.remuneration_cents/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'})));if(ride.offer_status==='disponible'){const btn=el('button','Accepter la course');btn.onclick=async()=>{if(!confirm('Accepter définitivement cette course ?'))return;btn.disabled=true;const a=await db.rpc('eps_accept_chauffeur_offer',{p_reservation_id:ride.reservation_id});if(a.error){msg(a.error.message,true);btn.disabled=false}else{msg(a.data);load()}};row.append(btn);$('available').append(row)}else $('accepted').append(row)}if(!$('available').children.length)$('available').textContent='Aucune course disponible.';if(!$('accepted').children.length)$('accepted').textContent='Aucune course acceptée.';msg('Courses actualisées.')} $('loginform').onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(r.error)$('loginmsg').textContent=r.error.message;else guard()};$('refresh').onclick=load;$('logout').onclick=async()=>{await db.auth.signOut();guard()};guard();</script></body></html>
