<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f1a16">
<link rel="icon" href="../assets/v2/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../assets/v2/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>EPS — Pilotage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../pricing.js?v=20261103-admin2"></script>
<style>
:root{
  --bg:#0f1a16; --surface:#16241f; --surface-2:#1d2e28; --line:#2a3d36;
  --ink:#ede6d6; --ink-2:#a9b3ac; --ink-3:#76837b;
  --gold:#c9ad73; --gold-ink:#1a1408;
  --alert:#d06a5a; --ok:#78ad8f; --wait:#d9b35b;
  --radius-lg:20px;
  --serif:"Fraunces",Georgia,serif; --sans:"Manrope",system-ui,-apple-system,sans-serif;
  --tab-h:64px; --side-w:248px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* En-tête */
.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent);padding:calc(env(safe-area-inset-top) + 14px) 0 12px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font:600 26px/1.1 var(--serif);letter-spacing:-.01em}
.top .sub{color:var(--ink-3);font-size:13px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink-2);fill:none;stroke-width:1.8}

/* Billet de la prochaine course */
.ticket{position:relative;margin:6px 0 22px;background:var(--gold);color:var(--gold-ink);border-radius:var(--radius-lg);padding:20px 20px 18px;overflow:hidden;width:100%;text-align:left;border:0;cursor:pointer;display:block}
.ticket::before,.ticket::after{content:"";position:absolute;top:96px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.ticket::before{left:-11px}.ticket::after{right:-11px}
.ticket .when{display:flex;align-items:baseline;gap:10px}
.ticket .time{font:600 64px/1 var(--serif);letter-spacing:-.03em}
.ticket .day{font-weight:600;font-size:15px}
.ticket .count{margin-left:auto;font-size:13px;font-weight:600;background:rgba(26,20,8,.12);padding:4px 10px;border-radius:999px;white-space:nowrap}
.ticket .perf{border-top:2px dashed rgba(26,20,8,.35);margin:18px -20px 14px}
.ticket .route{font:600 20px/1.25 var(--serif)}
.ticket .route span{display:block}
.ticket .route .to::before{content:"";display:inline-block;width:14px;height:2px;background:currentColor;vertical-align:middle;margin-right:8px;opacity:.6}
.ticket .who{margin-top:10px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px 14px}
.ticket .who b{font-weight:700}
.ticket.empty{background:var(--surface);color:var(--ink-2);border:1px dashed var(--line);cursor:default}
.ticket.empty::before,.ticket.empty::after{display:none}
.ticket.empty .route{color:var(--ink)}

/* Sections & listes */
h2{font:600 19px/1.2 var(--serif);margin:26px 0 10px}
.list{background:var(--surface);border-radius:var(--radius-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;color:inherit;text-decoration:none}
.row:last-child{border-bottom:0}
.row:active,.row:hover{background:var(--surface-2)}
.row.static{cursor:default}.row.static:hover{background:none}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--ink-2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;font-size:14px;color:var(--ink-2);white-space:nowrap}
.row .end b{display:block;color:var(--ink);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ink-3)}
.dot.alert{background:var(--alert)}.dot.ok{background:var(--ok)}.dot.wait{background:var(--wait)}
.chev{width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2;flex:none}
.empty-note{padding:18px 16px;color:var(--ink-2);font-size:14px}
.big-n{font:600 30px/1 var(--serif);min-width:44px;color:var(--ink)}
.row.todo .big-n{color:var(--alert)}
.more-link{display:block;text-align:center;padding:12px;color:var(--ink-2);font-size:14px;background:none;border:0;width:100%;cursor:pointer}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--radius-lg);overflow:hidden}
.stat{background:var(--surface);padding:14px 16px}
.stat .v{font:600 24px/1.1 var(--serif)}
.stat .l{color:var(--ink-2);font-size:13px;margin-top:2px}

/* Filtres */
.seg{display:flex;gap:6px;overflow-x:auto;margin:4px 0 14px;scrollbar-width:none}
.seg button{flex:none;border:1px solid var(--line);background:none;border-radius:999px;padding:8px 14px;font-size:14px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;margin-bottom:10px}

/* Boutons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;border:0;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;padding:0 14px}
.btn.primary{background:var(--gold);color:var(--gold-ink)}
.btn.quiet{background:var(--surface-2);color:var(--ink)}
.btn.ok{background:#2e5a43;color:#eaf5ee}
.btn.danger{background:none;border:1px solid #6a342c;color:#f0b9ae}
.btn.small{min-height:40px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:grid;gap:10px;margin-top:12px}
.btns.two{grid-template-columns:1fr 1fr}

/* Formulaires */
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px}
.field textarea{resize:vertical}
.amount{font:600 34px/1 var(--serif)!important;padding:12px 14px!important}
.hint{font-size:13px;color:var(--ink-2);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--surface);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font:600 17px/1.2 var(--serif)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:0}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.badge.partner{background:rgba(201,173,115,.16);color:var(--gold)}
.badge.alert{background:rgba(208,106,90,.16);color:#f0b9ae}
.badge.ok{background:rgba(120,173,143,.16);color:#b8dcc6}
.badge.wait{background:rgba(217,179,91,.16);color:#ecd29a}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.contact{display:flex;gap:10px;margin-top:12px}
.contact a{flex:1;text-align:center;padding:10px;border-radius:12px;background:var(--surface-2);text-decoration:none;color:var(--ink);font-weight:600;font-size:14px}
.check{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:22px;height:22px;accent-color:var(--gold)}
.robot{display:flex;align-items:center;gap:14px}
.robot .state{font:600 22px/1.1 var(--serif)}
.switch{margin-left:auto}
.preview{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14px;white-space:pre-wrap;color:var(--ink-2)}

/* Fiche */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-bottom:40px;transform:translateY(100%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s}
.sheet.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet .bar{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.sheet .bar .wrap{display:flex;align-items:center;gap:10px}
.sheet .bar h2{margin:0;flex:1;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrim{display:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}

/* Navigation mobile */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(15,26,22,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--ink-3);cursor:pointer;position:relative}
.tabs svg,.side svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;flex:none}
.tabs button[aria-current="page"]{color:var(--gold)}
.pip{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--alert);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.tabs .pip{position:absolute;top:8px;left:calc(50% + 8px)}
.side{display:none}

/* Ordinateur */
@media (min-width:1000px){
  body{padding-bottom:24px;padding-left:var(--side-w)}
  .tabs{display:none}
  .side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:var(--side-w);background:var(--surface);border-right:1px solid var(--line);padding:26px 14px;z-index:10}
  .side .brand{font:600 22px/1.1 var(--serif);padding:0 10px 22px}
  .side .brand span{display:block;color:var(--ink-3);font:500 13px/1.4 var(--sans);margin-top:4px}
  .side button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 12px;border-radius:12px;color:var(--ink-2);font-size:15px;font-weight:600;cursor:pointer;text-align:left}
  .side button:hover{background:var(--surface-2);color:var(--ink)}
  .side button[aria-current="page"]{background:var(--bg);color:var(--gold)}
  .side .pip{margin-left:auto}
  .side .foot{margin-top:auto;display:grid;gap:4px}
  .side .foot a{color:var(--ink-3);font-size:14px;text-decoration:none;padding:8px 12px;border-radius:10px}
  .side .foot a:hover{color:var(--ink);background:var(--surface-2)}
  .wrap{max-width:1120px;padding:0 32px}
  .top{padding-top:28px}
  .top h1{font-size:32px}
  .grid-desk{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
  .grid-desk>div>h2:first-child{margin-top:6px}
  .grid-desk.rev>:first-child{order:2}
  .stats.four{grid-template-columns:repeat(4,1fr)}
  .ticket{margin-top:6px}
  .sheet{left:auto;width:540px;box-shadow:-20px 0 60px rgba(0,0,0,.45);border-left:1px solid var(--line);transform:translateX(100%)}
  .sheet .wrap{padding:0 24px}
  .scrim{display:block;position:fixed;inset:0;z-index:19;background:rgba(5,10,8,.5);opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .table-rows .row{display:grid;grid-template-columns:14px minmax(0,2fr) minmax(0,1.3fr) minmax(0,1fr) 110px 16px}
  .table-head{display:grid;grid-template-columns:14px minmax(0,2fr) minmax(0,1.3fr) minmax(0,1fr) 110px 16px;gap:12px;padding:10px 16px;font-size:13px;color:var(--ink-3)}
}
@media (max-width:999px){.table-head{display:none}.desk-only{display:none}}

/* Message */
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px);z-index:30;max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);padding:13px 16px;border-radius:14px;font-weight:600;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.err{background:#f0b9ae;color:#3a120c}
@media (min-width:1000px){.toast{left:auto;right:28px;bottom:28px;width:420px}}

/* Connexion */
.login{min-height:100vh;display:grid;align-content:center;padding:24px 16px}
.login .brand{font:600 34px/1.05 var(--serif);margin:0 0 6px}
.login p{color:var(--ink-2);margin:0 0 24px}
.login form{max-width:420px}
@media (min-width:1000px){body:has(#login:not(.hidden)){padding-left:0}}
/* Bon de commande : document papier */
.docview{position:fixed;inset:0;z-index:40;background:#e9e5dc;overflow-y:auto;padding:0 0 40px}
.docview .doc-bar{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 0 10px;border-bottom:1px solid var(--line)}
.docview .doc-bar .wrap{display:flex;align-items:center;gap:10px}
.docview .doc-bar h2{margin:0;flex:1;font-size:18px;color:var(--ink)}
.doc-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:794px;margin:14px auto 0;padding:0 16px}
.doc-actions .btn{min-height:46px;font-size:15px}
.docview .btn.danger{color:#a4321f;border-color:#c98a7f;background:#fff}
.doc-actions .btn:last-child:nth-child(odd){grid-column:1/-1}
@media (max-width:600px){.docview{display:flex;flex-direction:column}.docview.hidden{display:none!important}.doc-actions{order:3;margin-top:16px}.paper{order:2}}
.paper{background:#fff;color:#1b1b1b;max-width:794px;margin:14px auto 0;padding:34px 30px 30px;font:14px/1.5 var(--sans);box-shadow:0 10px 40px rgba(0,0,0,.18)}
.paper .head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:2px solid #1b1b1b;padding-bottom:16px}
.paper .co b{font:600 20px/1.15 var(--serif);display:block;margin-bottom:4px;letter-spacing:.01em}
.paper .co div{font-size:12.5px;color:#444}
.paper .num{text-align:right}
.paper .num .t{font:600 26px/1.1 var(--serif)}
.paper .num .n{font-size:15px;font-weight:700;margin-top:4px}
.paper .num .d{font-size:12.5px;color:#444;margin-top:2px}
.paper .booked{margin:16px 0 4px;padding:12px 14px;background:#f4efe3;border-left:4px solid #9c7f43;font-size:14px}
.paper h3{font:600 15px/1.2 var(--serif);margin:22px 0 8px;color:#1b1b1b}
.paper table{width:100%;border-collapse:collapse}
.paper td{padding:7px 0;border-bottom:1px solid #e4e0d6;vertical-align:top}
.paper td:first-child{width:38%;color:#555;padding-right:12px}
.paper td:last-child{font-weight:600}
.paper .price td{font-size:17px;border-bottom:0;padding-top:12px}
.paper .foot{margin-top:24px;font-size:11.5px;color:#555;border-top:1px solid #e4e0d6;padding-top:12px}
.paper .void{color:#a4321f;font-weight:700;border:2px solid #a4321f;display:inline-block;padding:4px 10px;margin-top:10px}
@media (max-width:600px){.paper{padding:22px 16px;margin-top:10px}.paper .num{text-align:left}}
@media print{
  @page{size:A4;margin:10mm 12mm}
  body{padding:0!important;background:#fff!important}
  body>*:not(#docview){display:none!important}
  #docview{position:static;background:#fff;padding:0;overflow:visible}
  .doc-bar,.doc-actions{display:none!important}
  .paper{box-shadow:none;margin:0;max-width:none;padding:0;font-size:11.5px;line-height:1.35}
  .paper .head{padding-bottom:10px}
  .paper .co img{width:52px!important;height:52px!important;margin-bottom:6px!important}
  .paper .co b{font-size:17px}
  .paper .co div,.paper .num .d{font-size:10.5px}
  .paper .num .t{font-size:22px}
  .paper .booked{margin:10px 0 2px;padding:7px 10px;font-size:12px}
  .paper h3{font-size:13px;margin:12px 0 4px}
  .paper td{padding:3.5px 0}
  .paper .price td{font-size:14px;padding-top:6px}
  .paper .foot{margin-top:12px;padding-top:8px;font-size:9.5px}
  .paper,.paper *{break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{height:auto!important;overflow:visible!important}
}
</style>
</head>
<body>

<section id="login" class="login hidden">
  <div class="wrap">
    <img src="../assets/v2/logo-eps-256.webp" alt="Logo Elite Prestige Services" width="84" height="84" style="display:block;margin-bottom:18px">
    <h1 class="brand">Elite Prestige<br>Services</h1>
    <p>Connecte-toi pour piloter tes courses.</p>
    <form id="loginform">
      <label class="field"><span>E-mail</span><input id="email" type="email" autocomplete="email" required></label>
      <label class="field"><span>Mot de passe</span><input id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Se connecter</button>
      <p id="loginmsg" class="hint" role="status"></p>
    </form>
  </div>
</section>

<div id="app" class="hidden">
  <nav class="side" aria-label="Navigation principale">
    <div class="brand"><img src="../assets/v2/logo-eps-256.webp" alt="" width="44" height="44" style="display:block;margin-bottom:12px">Elite Prestige Services<span>Pilotage</span></div>
    <div id="side-nav"></div>
    <div class="foot">
      <a href="https://www.elite-prestige-services.fr/" target="_blank" rel="noopener">Voir le site</a>
      <a href="../chauffeur/">Espace chauffeur</a>
    </div>
  </nav>

  <header class="top"><div class="wrap">
    <div><h1 id="title">Aujourd’hui</h1><div class="sub" id="subtitle"></div></div>
    <button class="icon-btn" id="refresh" aria-label="Actualiser"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
  </div></header>

  <main class="wrap" id="view"></main>

  <nav class="tabs" aria-label="Navigation"><div class="wrap" id="tab-nav"></div></nav>
</div>

<div class="scrim" id="scrim"></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="bar"><div class="wrap">
    <button class="icon-btn" id="sheet-close" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h2 id="sheet-title"></h2>
  </div></div>
  <div class="wrap" id="sheet-body"></div>
</section>

<section id="docview" class="docview hidden" role="dialog" aria-modal="true" aria-labelledby="doc-title">
  <div class="doc-bar"><div class="wrap">
    <button class="icon-btn" id="doc-close" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h2 id="doc-title">Bon de commande</h2>
  </div></div>
  <div class="doc-actions" id="doc-actions"></div>
  <article class="paper" id="paper"></article>
</section>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SB = 'https://lrtuztxjngdvrnjuwxfr.supabase.co';
const db = createClient(SB, 'sb_publishable_GeaRT-N3IE03M19HCB4MVg_RQwbSnYu');
const SITE = 'https://www.elite-prestige-services.fr/';

/* ================= Outils ================= */
const $ = id => document.getElementById(id);
function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v; // réservé à nos icônes SVG statiques
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;

function stage(b) {
  const pay = by(S.pays, b.id), quote = by(S.quotes, b.id);
  if (b.status === 'annulée') return { key: 'off', label: 'Annulée', cls: '' };
  if (pay?.state === 'payé') return { key: 'paid', label: 'Payée', cls: 'ok' };
  if (pay?.state === 'autorisé') return { key: 'auth', label: 'Garantie à encaisser', cls: 'alert' };
  if (b.status === 'confirmée') return { key: 'confirmed', label: 'Confirmée', cls: 'ok' };
  if (quote || b.status === 'devis envoyé') return { key: 'quoted', label: 'Devis envoyé', cls: 'wait' };
  return { key: 'new', label: 'Devis à faire', cls: 'alert' };
}
const isPast = b => b.date < parisToday();
const needsAction = b => !isPast(b) && ['new', 'auth'].includes(stage(b).key);
const startOf = b => Date.parse(b.date + 'T' + ((b.time || '00:00').slice(0, 5)) + ':00');
function suggest(b) {
  const partner = b.partner_code ? S.partners.find(p => p.code === b.partner_code) : null;
  if ((b.type || '') === 'Mise à disposition') {
    const hours = Math.max(2, Number(b.duration_hours) || 2);
    const hourly = { 'Business Class': 100, 'Business Van': 120, 'First Class': 150, 'Electric Class': 150 }[b.vehicle] || 100;
    return { amount: Math.ceil(hours * hourly / 5) * 5, why: hours + ' h × ' + hourly + ' € de l’heure' };
  }
  const e = window.epsEstimatePrice?.({ type: b.type || 'Transfert', departure: b.departure, destination: b.destination, date: b.date, time: b.time, vehicle: b.vehicle });
  if (!e) return null;
  if (partner) return { amount: e.base, why: 'Tarif partenaire fixe (' + partner.name + '), sans majoration' };
  if (e.percent) return { amount: e.amount, why: e.base + ' € + ' + e.percent + ' % ' + (e.event ? '(' + e.event + ')' : '(dernière minute)') };
  return { amount: e.amount, why: 'Tarif de base du site' };
}

async function importProspects(input, btn) {

    const X = await loadXlsx();

    let added = 0, dup = 0, stop = 0, failed = 0;
    for (let i = 0; i < uniq.length; i += 100) {

      if (a.error || b.error) throw Error((a.error || b.error).message);

    }

function parisToIso(local) {
  const guess = new Date(local + ':00Z');
  const shown = new Date(new Date(guess).toLocaleString('en-US', { timeZone: 'Europe/Paris' }));
  const utcShown = new Date(guess.toLocaleString('en-US', { timeZone: 'UTC' }));
  return new Date(guess.getTime() - (shown - utcShown)).toISOString();
}

  if (r.error) $('loginmsg').textContent = 'Connexion refusée : vérifie l’e-mail et le mot de passe.'; else guard();

window.epsPricingReady?.then(() => { if (!$('app').classList.contains('hidden') && tab === 'courses') render(); });
guard();
</script>
