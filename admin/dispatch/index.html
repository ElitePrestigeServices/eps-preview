<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Dispatch réel EPS — Administration</title><style>*{box-sizing:border-box}body{margin:0;background:#121813;color:#f5eee2;font:15px/1.5 Arial}header,main{max-width:1120px;margin:auto;padding:22px}header{border-bottom:1px solid #7e6944}h1,h2{font-family:Georgia,serif;font-weight:400;color:#e7c58a}.panel{background:#202820;border:1px solid #776340;border-radius:12px;padding:20px;margin:18px 0}button{background:#e2bf7c;color:#171a14;padding:11px 17px;border:0;border-radius:7px;cursor:pointer;margin:5px}button:disabled{opacity:.45}input,select{padding:11px;background:#101810;color:white;border:1px solid #97805a;border-radius:7px;margin:5px;max-width:100%}a{color:#e6c48a}.hidden{display:none}.error{color:#ffb5a5}.item{padding:15px 0;border-bottom:1px solid #5a614f}.muted{color:#c5c3b7}.scroll{overflow-x:auto}</style><style id="eps-mobile-compact-admin-dispatch-index-html">

</style></head><body><header><a href="../">← Administration EPS</a> · <a href="../documents/">Documents chauffeurs</a></header><main><h1>Dispatch EPS</h1><p class="muted">Espace administrateur connecté à Supabase. Seules les réservations confirmées peuvent être diffusées. Aucune notification email automatique n’est encore envoyée.</p><section id="login" class="panel"><h2>Connexion administrateur</h2><form id="loginform"><input id="email" type="email" placeholder="Email" required autocomplete="email"><input id="password" type="password" placeholder="Mot de passe" required autocomplete="current-password"><button>Se connecter</button></form><p id="loginmsg" role="status"></p></section><section id="app" class="hidden"><button id="refresh">Actualiser</button><button id="logout">Déconnexion</button><p id="msg" role="status"></p><section class="panel"><h2>Réservations confirmées</h2><div id="reservations"></div></section><section class="panel"><h2>Courses déjà diffusées</h2><div id="missions"></div></section></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const db=createClient('https://lrtuztxjngdvrnjuwxfr.supabase.co','sb_publishable_GeaRT-N3IE03M19HCB4MVg_RQwbSnYu');const $=id=>document.getElementById(id);const el=(tag,txt)=>{const x=document.createElement(tag);x.textContent=txt;return x};const money=n=>(n/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});function msg(t,err=false){$('msg').textContent=t;$('msg').classList.toggle('error',err)}async function guard(){const{data:{user}}=await db.auth.getUser();const{data:admin}=user?await db.rpc('eps_is_admin'):{data:false};$('login').classList.toggle('hidden',!!admin);$('app').classList.toggle('hidden',!admin);if(admin)load();else if(user)$('loginmsg').textContent='Ce compte ne possède pas les droits EPS.'}async function load(){msg('Chargement…');$('reservations').replaceChildren();$('missions').replaceChildren();const [rr,mm]=await Promise.all([db.from('eps_reservations').select('id,reference,departure,destination,date,time,vehicle,status').eq('status','confirmée').order('date'),db.from('eps_chauffeur_missions').select('reservation_id,status,chauffeur_email,accepted_at')]);if(rr.error||mm.error){msg((rr.error||mm.error).message,true);return}const assigned=new Set(mm.data.map(x=>x.reservation_id));for(const r of rr.data.filter(x=>!assigned.has(x.id))){const row=el('div','');row.className='item';row.append(el('h3',(r.reference||'Réservation')+' · '+r.departure+' → '+r.destination),el('p',r.date+' '+r.time+' · '+r.vehicle));const btn=el('button','Choisir les chauffeurs');btn.onclick=async()=>{btn.disabled=true;const e=await db.rpc('eps_dispatch_eligible',{p_vehicle:r.vehicle});if(e.error){msg(e.error.message,true);btn.disabled=false;return}if(!e.data.length){msg('Aucun chauffeur validé avec documents à jour pour '+r.vehicle,true);btn.disabled=false;return}btn.remove();const form=document.createElement('form');const list=el('div','');for(const p of e.data){const label=document.createElement('label');label.style.display='block';const input=document.createElement('input');input.type='checkbox';input.value=p.user_id;label.append(input,document.createTextNode(' '+p.driver_name+' — '+p.vehicle));list.append(label)}const amount=el('label','Rémunération proposée au chauffeur (€) ');const price=document.createElement('input');price.type='number';price.min='1';price.step='0.01';price.required=true;amount.append(price);const send=el('button','Diffuser aux chauffeurs sélectionnés');send.type='submit';form.append(list,amount,send);form.onsubmit=async ev=>{ev.preventDefault();const ids=[...list.querySelectorAll('input:checked')].map(x=>x.value);const cents=Math.round(Number(price.value)*100);if(!ids.length||!Number.isInteger(cents)||cents<100){msg('Sélectionnez des chauffeurs et une rémunération valide.',true);return}if(!confirm('Diffuser cette course à '+ids.length+' chauffeur(s) pour '+money(cents)+' chacun ?'))return;send.disabled=true;const result=await db.rpc('eps_dispatch_publish',{p_reservation:r.id,p_amount_cents:cents,p_drivers:ids});if(result.error){msg(result.error.message,true);send.disabled=false}else{msg('Course diffusée à '+result.data+' chauffeur(s).');load()}};row.append(form)};row.append(btn);$('reservations').append(row)}if(!$('reservations').children.length)$('reservations').textContent='Aucune réservation confirmée en attente de diffusion.';for(const m of mm.data){const r=rr.data.find(x=>x.id===m.reservation_id);const row=el('div',(r?.reference||m.reservation_id)+' · '+m.status+(m.chauffeur_email?' · Chauffeur : '+m.chauffeur_email:''));row.className='item';$('missions').append(row)}if(!mm.data.length)$('missions').textContent='Aucune course diffusée.';msg('Données actualisées.')} $('loginform').onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(r.error)$('loginmsg').textContent=r.error.message;else guard()};$('refresh').onclick=load;$('logout').onclick=async()=>{await db.auth.signOut();guard()};guard();</script></body></html>
