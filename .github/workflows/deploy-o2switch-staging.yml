name: EPS - publication automatique vers o2switch (préproduction)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eps-o2switch-staging
  cancel-in-progress: false

env:
  # Nom du serveur présent dans le certificat FTPS vérifié le 29/09/2026.
  # Ne pas utiliser ftp.hicu1011.odns.fr : certificat non concordant.
  EPS_FTP_SERVER: chevrotin.o2switch.net
  EPS_TARGET_SUBDIR: eps-preview-main

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Vérifier les identifiants de déploiement
        env:
          USER: ${{ secrets.EPS_FTP_USER }}
          PASSWORD: ${{ secrets.EPS_FTP_PASSWORD }}
          DIRECTORY: ${{ secrets.EPS_FTP_STAGING_DIR }}
        run: |
          test -n "$USER" && test -n "$PASSWORD" && test -n "$DIRECTORY" || {
            echo "::error::Configurer EPS_FTP_USER, EPS_FTP_PASSWORD et EPS_FTP_STAGING_DIR dans GitHub Secrets."
            exit 1
          }
          # Le compte epsdeploy est limité par o2switch à /home/hicu1011/eps-nouveau.
          # Son répertoire FTP / correspond donc uniquement à ce dossier.
          test "$USER" = "epsdeploy@hicu1011.odns.fr" || {
            echo "::error::Compte FTP non reconnu : seul epsdeploy est autorisé."
            exit 1
          }
          test "$DIRECTORY" = "/" || {
            echo "::error::Utiliser / comme répertoire FTP du compte epsdeploy limité à eps-nouveau."
            exit 1
          }
      - uses: actions/checkout@v4
      - name: Installer les outils de déploiement
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp imagemagick
      - name: Diagnostic certificat FTPS
        run: |
          echo "Certificat présenté par le serveur FTPS :"
          timeout 20 openssl s_client -connect "$EPS_FTP_SERVER:21" -starttls ftp -servername "$EPS_FTP_SERVER" </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
      - name: Contrôle de connexion FTPS
        env:
          USER: ${{ secrets.EPS_FTP_USER }}
          PASSWORD: ${{ secrets.EPS_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          export LFTP_PASSWORD="$PASSWORD"
          unset PASSWORD
          timeout 120 lftp --env-password -u "$USER" "ftp://$EPS_FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 1
          set net:timeout 25
          cd /$EPS_TARGET_SUBDIR
          cls -1 .
          bye
          EOF
          echo "Connexion FTPS et dossier de préproduction vérifiés."
      - name: Préparer les fichiers publics
        run: |
          mkdir -p "$RUNNER_TEMP/eps-public"
          rsync -a ./ "$RUNNER_TEMP/eps-public/" \
            --exclude=.git --exclude=.github --exclude=.gitignore \
            --exclude=README.md --exclude='*.md' \
            --exclude='node_modules' --exclude='.env*'
      - name: Optimiser les photos pour le web
        run: |
          set -euo pipefail
          ASSET_DIR="$RUNNER_TEMP/eps-public/assets"
          test -d "$ASSET_DIR" || exit 0
          echo "Poids des images avant optimisation :"
          du -sh "$ASSET_DIR"
          find "$ASSET_DIR" -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -print0 | while IFS= read -r -d '' file; do
            mogrify -auto-orient -strip -interlace Plane -sampling-factor 4:2:0 -resize '1920x1920>' -quality 78 "$file"
          done
          echo "Poids des images après optimisation :"
          du -sh "$ASSET_DIR"
      - name: Publier uniquement en préproduction o2switch
        env:
          USER: ${{ secrets.EPS_FTP_USER }}
          PASSWORD: ${{ secrets.EPS_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          export LFTP_PASSWORD="$PASSWORD"
          unset PASSWORD
          lftp --env-password -u "$USER" "ftp://$EPS_FTP_SERVER" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 2
          set net:timeout 25
          cd /$EPS_TARGET_SUBDIR
          mirror --reverse --verbose=1 --only-newer --parallel=3 "$RUNNER_TEMP/eps-public" .
          bye
          EOF
          echo "Publication EPS dans /$EPS_TARGET_SUBDIR/ terminée."
