</style></head><body><main><p><a href="../reservations/">← Réservations et devis</a></p><h1>Demandes de modification et d’annulation</h1><p>Administration EPS — traiter les demandes ne modifie pas automatiquement les réservations et n’envoie pas d’e-mail.</p><section id="login"><h2>Connexion administrateur</h2><form id="form"><input id="email" type="email" placeholder="E-mail" required><input id="password" type="password" placeholder="Mot de passe" required><button>Se connecter</button></form></section><section id="app" hidden><button id="refresh">Actualiser</button><button id="logout">Déconnexion</button><p id="msg" role="status"></p><div id="items"></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const db=createClient('https://lrtuztxjngdvrnjuwxfr.supabase.co','sb_publishable_GeaRT-N3IE03M19HCB4MVg_RQwbSnYu');const $=id=>document.getElementById(id),E=(t,v)=>{const x=document.createElement(t);x.textContent=v;return x};async function guard(){const u=await db.auth.getUser();const a=u.data.user?await db.rpc('eps_is_admin'):{data:false};$('login').hidden=!!a.data;$('app').hidden=!a.data;if(a.data)load()}async function load(){const [req,book]=await Promise.all([db.from('eps_customer_requests').select('id,reservation_id,request_type,message,status,created_at').order('created_at',{ascending:false}).limit(100),db.from('eps_reservations').select('id,reference,customer_name,customer_email,status,date,time')]);if(req.error||book.error){$('msg').textContent=(req.error||book.error).message;return}const root=$('items');root.replaceChildren();if(!req.data.length)root.append(E('p','Aucune demande client.'));for(const x of req.data){const b=book.data.find(z=>z.id===x.reservation_id),card=E('article');card.append(E('h2',(b?.reference||'Réservation')+' · '+x.request_type),E('p','Demande : '+x.status+' · '+new Date(x.created_at).toLocaleString('fr-FR')),E('p',x.message));if(b)card.append(E('p','Client : '+b.customer_name+' · '+b.customer_email+' · Réservation : '+b.status));if(x.status==='en_attente'){for(const action of ['traitée','refusée']){const btn=E('button',action==='traitée'?'Marquer traitée':'Marquer refusée');btn.onclick=async()=>{if(!confirm('Cette action ne modifie pas la réservation. Confirmer ?'))return;btn.disabled=true;const r=await db.rpc('eps_admin_review_customer_request',{p_request:x.id,p_action:action});if(r.error){$('msg').textContent=r.error.message;btn.disabled=false}else load()};card.append(btn)}}root.append(card)}}$('form').onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(r.error)alert(r.error.message);else guard()};$('refresh').onclick=load;$('logout').onclick=async()=>{await db.auth.signOut();guard()};guard();</script></body></html>
