<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Documents chauffeurs — EPS</title><style>*{box-sizing:border-box}body{margin:0;background:#111713;color:#f4ede0;font:15px/1.5 Arial,sans-serif}header,main{max-width:1100px;margin:auto;padding:22px}header{border-bottom:1px solid #79643e}h1{font:normal 36px Georgia,serif;color:#e7c78b}.panel{background:#1d251e;border:1px solid #645639;border-radius:12px;padding:20px;margin:20px 0}input,button{padding:12px;border-radius:7px;font:inherit}input{width:100%;max-width:360px;margin:5px 0 15px;background:#0d120e;color:white;border:1px solid #8a7650}button{background:#d9b777;color:#181b15;border:0;cursor:pointer;margin:5px 6px 5px 0}button:disabled{opacity:.5}a{color:#e5c58b}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #4b5146;text-align:left;vertical-align:top}.scroll{overflow-x:auto}small{color:#c5c5b9}.error{color:#ffb9aa}img{max-width:100%}@media(max-width:650px){h1{font-size:29px}}</style><style id="eps-mobile-compact-admin-documents-index-html">
@media(max-width:700px){
body{overflow-x:hidden}
main,.main{padding-top:14px!important;padding-bottom:40px!important}
.panel,.stat,.eps-module,.mission{margin-top:8px!important;margin-bottom:8px!important;padding:12px!important}
h1{font-size:28px!important;margin:5px 0 9px!important}h2{font-size:19px!important;margin-bottom:9px!important}
p,.muted{line-height:1.4!important}
.grid,.stats,.layout,.eps-live-modules{gap:8px!important}
input,select,textarea{min-height:44px!important}
table{font-size:12px!important}
th,td{padding-top:10px!important;padding-bottom:10px!important}
}
</style></head><body><header><a href="../">← Administration EPS</a></header><main><h1>Documents des chauffeurs</h1><p>Accès réservé à l’administrateur EPS. Les justificatifs restent privés et sont ouverts par des liens temporaires.</p><section id="login" class="panel"><h2>Connexion administrateur</h2><form id="login-form"><label>Email<br><input id="email" type="email" autocomplete="username" required></label><br><label>Mot de passe<br><input id="password" type="password" autocomplete="current-password" required></label><br><button>Se connecter</button></form><p id="login-msg" role="status"></p></section><section id="dashboard" class="panel hidden"><button id="refresh">Actualiser les dossiers</button><button id="logout">Déconnexion</button><p id="status" role="status"></p><h2>Candidatures chauffeurs</h2><div id="candidates"></div><h2>Documents reçus</h2><div class="scroll"><table><thead><tr><th>Chauffeur</th><th>Document</th><th>Expiration</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="docs"></tbody></table></div></section></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const db=createClient('https://lrtuztxjngdvrnjuwxfr.supabase.co','sb_publishable_GeaRT-N3IE03M19HCB4MVg_RQwbSnYu');const $=id=>document.getElementById(id);const types={carte_vtc:'Carte VTC — recto',carte_vtc_verso:'Carte VTC — verso',rc_pro:'RC Pro',assurance_auto:'Assurance automobile',carte_grise:'Carte grise',identite_siret:'Justificatif SIRET',identite_recto:'Carte d’identité — recto',identite_verso:'Carte d’identité — verso'};let isAdmin=false;function msg(id,text,error=false){$(id).textContent=text;$(id).classList.toggle('error',error)}async function guard(){const{data:{user}}=await db.auth.getUser();if(!user){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');return}const{data,error}=await db.rpc('eps_is_admin');isAdmin=!error&&data===true;if(!isAdmin){msg('login-msg','Ce compte ne possède pas les droits administrateur EPS.',true);$('dashboard').classList.add('hidden');$('login').classList.remove('hidden');return}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await load()}async function load(){msg('status','Chargement des documents…');$('docs').replaceChildren();const{data:docs,error}=await db.from('eps_chauffeur_documents').select('id,chauffeur_id,document_type,storage_path,filename,expires_on,status,created_at').order('created_at',{ascending:false});if(error){msg('status','Erreur : '+error.message,true);return}const p=await db.from('eps_chauffeur_profiles').select('user_id,first_name,last_name,vehicle,email,status,created_at').order('created_at',{ascending:false});if(p.error){msg('status','Profils indisponibles : '+p.error.message,true);return}const profiles=p.data;$('candidates').replaceChildren();for(const person of profiles){const line=document.createElement('div');line.style.cssText='padding:13px 0;border-bottom:1px solid #454b40';const name=document.createElement('strong');name.textContent=[person.first_name,person.last_name].filter(Boolean).join(' ')+' — '+person.vehicle+' ('+person.status+')';line.append(name);const count=document.createElement('p');const own=docs.filter(d=>d.chauffeur_id===person.user_id);count.textContent=own.length+' pièce(s) reçue(s)';line.append(count);for(const [label,action] of [['Valider le chauffeur','approve'],['Suspendre','suspend'],['Refuser','reject']]){const b=document.createElement('button');b.textContent=label;b.disabled=action==='approve'&&person.status==='approved';b.onclick=async()=>{if(!confirm(label+' : '+name.textContent+' ?'))return;const r=await db.rpc('eps_review_chauffeur',{p_chauffeur:person.user_id,p_action:action});if(r.error)msg('status',r.error.message,true);else load()};line.append(b)}$('candidates').append(line)}const names=new Map(profiles.map(p=>[p.user_id,p]));for(const d of docs){const tr=document.createElement('tr');const p=names.get(d.chauffeur_id);const full=p?[p.first_name,p.last_name].filter(Boolean).join(' ')+' — '+p.vehicle:'Profil non disponible';for(const value of [full,types[d.document_type]||d.document_type,d.expires_on||'Non indiquée',d.status]){const td=document.createElement('td');td.textContent=value;tr.append(td)}const actions=document.createElement('td');const open=document.createElement('button');open.textContent='Voir le document';open.onclick=async()=>{const{data,error}=await db.storage.from('eps-chauffeur-documents').createSignedUrl(d.storage_path,60);if(error){msg('status',error.message,true);return}window.open(data.signedUrl,'_blank','noopener,noreferrer')};actions.append(open);if(d.status==='pending'){for(const [label,status]of [['Valider','approved'],['Refuser','rejected']]){const b=document.createElement('button');b.textContent=label;b.disabled=status==='approved'&&!!d.expires_on&&d.expires_on<new Date().toISOString().slice(0,10);b.onclick=async()=>{if(!confirm(label+' ce document ?'))return;const{error}=await db.from('eps_chauffeur_documents').update({status,reviewed_at:new Date().toISOString()}).eq('id',d.id);if(error)msg('status',error.message,true);else load()};actions.append(b)}}tr.append(actions);$('docs').append(tr)}msg('status',profiles.length+' chauffeur(s), '+docs.length+' document(s).')} $('login-form').onsubmit=async e=>{e.preventDefault();msg('login-msg','Connexion…');const{error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error)msg('login-msg',error.message,true);else guard()};$('logout').onclick=async()=>{await db.auth.signOut();isAdmin=false;guard()};$('refresh').onclick=()=>{if(isAdmin)load()};guard();setInterval(()=>{if(isAdmin&&!document.hidden)load()},20000);</script></body></html>
